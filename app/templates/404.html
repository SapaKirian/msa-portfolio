{% extends "base.html" %}

{% block title %}404 - Halaman Tidak Ditemukan{% endblock %}

{% block content %}
<section class="error-404">
    <div class="error-404__flag" aria-hidden="true"></div>

    <p class="error-404__code">404</p>
    <h1 class="error-404__title">Kamu Keluar Lintasan</h1>
    <p class="error-404__desc">
        Halaman yang kamu cari tidak ditemukan — mungkin sudah pindah jalur, atau memang belum pernah ada.
    </p>

    <a href="{{ url_for('main.home') }}" class="btn btn--primary">Kembali ke Garis Start</a>
</section>
{% endblock %}
