{% extends "base.html" %}

{% block title %}Skills - MSA Portfolio{% endblock %}

{% block content %}
<section class="skills">
    <p class="section-label">What I Know</p>
    <h1 class="section-title">Skills & Tools</h1>

    {% for group in skill_categories %}
    <div class="skills__group">
        <h2 class="skills__group-title">{{ group.category }}</h2>

        <div class="skills__grid">
            {% for skill in group.skills %}
            <div class="skill-card">
                <i class="fa-solid fa-microchip skill-card__icon"></i>
                <h3 class="skill-card__name">{{ skill.name }}</h3>
                <span class="skill-card__level skill-card__level--{{ skill.level | lower | replace(' ', '-') }}">
                    {{ skill.level }}
                </span>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</section>
{% endblock %}
